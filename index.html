/* ===== Zeno-style redesign (soft glass, blue accent, glossy orb) ===== */
:root{--bg:#f3f6fd;--s1:#ffffff;--s2:#eef2fb;--tx:#0d1530;--mu:#6c7794;--ln:rgba(120,140,190,.18);--ac:#1a5fff;--ac2:#5b9bff;--acs:#e5edff;--bad:#e0405a;--bads:#fde9ed;--sh:0 12px 34px rgba(36,76,190,.10);--sh2:0 6px 18px rgba(36,76,190,.10);--glass:rgba(255,255,255,.74);--fade:rgba(243,246,253,.94);
--page:radial-gradient(70% 38% at 108% 38%,rgba(54,112,255,.30),transparent 70%),radial-gradient(80% 40% at -12% 80%,rgba(96,150,255,.26),transparent 70%),radial-gradient(60% 30% at 18% 0%,rgba(255,255,255,.95),transparent 70%),linear-gradient(180deg,#f8faff,#eef3fd)}
html.dark{--bg:#080c18;--s1:#121a30;--s2:#1a2440;--tx:#eef2ff;--mu:#9aa6c6;--ln:rgba(140,160,220,.16);--ac:#4a86ff;--ac2:#7db0ff;--acs:#16254d;--bads:#3a1822;--sh:0 12px 34px rgba(0,0,0,.45);--sh2:0 6px 18px rgba(0,0,0,.35);--glass:rgba(18,26,48,.76);--fade:rgba(8,12,24,.94);
--page:radial-gradient(70% 38% at 108% 38%,rgba(40,90,255,.30),transparent 70%),radial-gradient(80% 40% at -12% 82%,rgba(110,70,230,.24),transparent 70%),linear-gradient(180deg,#080c18,#0a1022)}
html{background:var(--bg)}
body{background:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--page);pointer-events:none}

/* glossy glass orb (brand mark) */
.orb{background:radial-gradient(circle at 50% 38%,#fff 0,#eef2ff 55%,#d6e2ff 100%);box-shadow:0 8px 24px rgba(26,95,255,.28),inset 0 0 0 1px rgba(255,255,255,.75)}
.orb::before{inset:-22%;background:radial-gradient(38% 34% at 28% 38%,#ff6bd6 0,transparent 100%),radial-gradient(44% 40% at 72% 62%,#1a5fff 0,transparent 100%),radial-gradient(34% 30% at 58% 28%,#9b5cff 0,transparent 100%),radial-gradient(30% 26% at 40% 74%,#4fb0ff 0,transparent 100%);filter:blur(calc(var(--s,40px)*.09));animation:orbflow 7s ease-in-out infinite alternate}
.orb::after{inset:0;background:radial-gradient(circle at 32% 20%,rgba(255,255,255,.95),rgba(255,255,255,0) 42%),radial-gradient(circle at 50% 120%,rgba(255,255,255,.5),transparent 55%);box-shadow:inset 0 0 calc(var(--s,40px)*.14) rgba(255,255,255,.9)}
@keyframes orbflow{0%{transform:rotate(0) scale(1)}50%{transform:rotate(90deg) scale(1.08)}100%{transform:rotate(200deg) scale(.96)}}

/* header + round buttons */
.top{padding:calc(14px + var(--safet)) 18px 10px}
.ib{width:44px;height:44px;border-radius:50%;background:var(--s1);border:0;box-shadow:var(--sh2);color:var(--tx)}
.ch .brand{text-align:center}.ch b{font-size:16px}
.ch{padding:calc(12px + var(--safet)) 14px 10px}

/* surfaces */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;border:0;border-radius:34px;padding:28px 20px 20px;background:linear-gradient(160deg,rgba(255,255,255,.92),rgba(222,233,255,.82));box-shadow:var(--sh)}
html.dark .hero{background:linear-gradient(160deg,rgba(26,36,66,.92),rgba(14,20,40,.9))}
.hero .orb{--s:118px!important}
.hero h2{font-size:21px}.hero p{max-width:30ch}
.launch{border:0;background:var(--s1);box-shadow:var(--sh2);border-radius:30px;padding:8px 8px 8px 18px}
.launch i{width:42px;height:42px;border-radius:50%;background:var(--ac);box-shadow:0 6px 16px color-mix(in srgb,var(--ac) 40%,transparent)}
.launch i svg,.rb.send svg{transform:scaleX(-1)}
.tile,.row,.manage-section,.stat-card,.stats-card{border:0;background:var(--s1);box-shadow:var(--sh2)}
.tile{border-radius:28px}.row{border-radius:24px}.manage-section{border-radius:28px}
.row.sel{background:var(--acs)}
.manage-item{border:0}
.chip{border-radius:50%}
.pill{border:0;background:var(--s1);box-shadow:var(--sh2)}.pill.on{background:var(--ac);color:#fff}
.btn{border-radius:22px;background:var(--ac);box-shadow:0 10px 24px color-mix(in srgb,var(--ac) 36%,transparent);padding:14px}.btn.bad{background:var(--bads);box-shadow:none}
.sh{border-radius:34px 34px 0 0}
.opts{border:0;box-shadow:var(--sh2);border-radius:22px}
.tabs{border:0;border-radius:32px;background:var(--glass);box-shadow:var(--sh);padding:7px}
.tabs button{border-radius:24px}.tabs button.on{background:var(--ac);color:#fff}
.start .orb{--s:108px!important}.start{padding-top:46px}.start h3{font-size:20px}

/* chat messages */
#msgs{gap:18px}
.msg.ai{flex-direction:row;align-items:flex-start;gap:10px}
.msg.ai>.av{margin-top:2px}
.mcol{min-width:0;flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:5px}
.mcol .mh{font-size:10.5px}
.msg.ai .mb{max-width:96%;padding:11px 15px;background:var(--s1);border-radius:20px;border-start-start-radius:6px;box-shadow:var(--sh2)}
.msg.user .mb{background:var(--ac);border-radius:22px;border-end-start-radius:6px;padding:11px 16px;box-shadow:0 8px 20px color-mix(in srgb,var(--ac) 32%,transparent)}
.ma{margin-inline-start:-4px;gap:0}
.ma button{width:32px;height:32px;justify-content:center;padding:0;border-radius:50%}
.ma button.speak[disabled]{width:auto;padding:0 10px;border-radius:99px;font-size:11px}
.ma button.on{color:var(--ac)}.ma button.on svg.i{fill:currentColor}
.st .spin{display:inline-grid}.st .spin svg.i{width:14px;height:14px;animation:spin 1s linear infinite}
.imgstack{position:relative;width:min(82%,310px);margin:20px 8px 14px;isolation:isolate}
.imgstack::before,.imgstack::after{content:"";position:absolute;inset:0;border-radius:24px;z-index:-1}
.imgstack::before{background:linear-gradient(135deg,#ff9a4d,#ff4d7a);transform:rotate(-8deg) translate(-10px,-4px)}
.imgstack::after{background:linear-gradient(135deg,#1a5fff,#0a2a8a);transform:rotate(7deg) translate(12px,-2px)}
.imgstack img{width:100%;height:auto;border:0;border-radius:24px;box-shadow:0 14px 30px rgba(20,40,120,.28);transform:rotate(-1.5deg)}

/* composer */
.dock{padding:30px 14px calc(12px + var(--safeb));background:linear-gradient(transparent,var(--fade) 45%)}
.comp{gap:4px;padding:8px;border-radius:34px;background:var(--s1);border:0;box-shadow:0 12px 32px rgba(26,70,190,.16)}
.comp:focus-within{box-shadow:0 0 0 2px color-mix(in srgb,var(--ac) 38%,transparent),0 12px 32px rgba(26,70,190,.16)}
.rb{width:44px;height:44px}
#clipBtn{border:1.6px solid color-mix(in srgb,var(--tx) 24%,transparent);color:var(--tx)}
.rb.send{background:var(--ac);box-shadow:0 6px 16px color-mix(in srgb,var(--ac) 42%,transparent)}
.rb.mic,.rb.voicechat{background:none;border:0;color:var(--mu)}
.rb.voicechat.active{background:var(--bads);color:var(--bad)}
.vc-pill{display:none;align-items:center;gap:8px;margin:0 auto 8px;padding:8px 14px;border-radius:99px;background:var(--acs);color:var(--ac);font-size:12px;font-weight:700}
.vc-pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ac);animation:micPulse 1.1s ease-in-out infinite}
body.vc-min .vc-pill{display:flex}

/* ===== full-screen voice chat ===== */
.vc{display:none;position:fixed;inset:0;z-index:60;flex-direction:column;align-items:center;padding:calc(14px + var(--safet)) 20px calc(22px + var(--safeb));background:var(--page);background-color:var(--bg);overflow:hidden}
body.vc-on:not(.vc-min){overflow:hidden}
body.vc-on:not(.vc-min) .vc{display:flex}
.vc-top{width:100%;max-width:520px;display:flex;align-items:center;gap:12px}
.vc-top b{flex:1;text-align:center;font-size:17px;font-weight:700}
.vc-sp{width:44px;flex:none}
.vc-status{margin-top:14px;min-height:24px;color:var(--ac);font-size:13.5px;font-weight:600}
.vc[data-state=muted] .vc-status{color:var(--bad)}
.vc-stage{flex:1;min-height:0;width:100%;display:grid;place-items:center;padding:8px 0}
.vc-orb{--s:min(46vw,190px,28vh);box-shadow:0 22px 54px rgba(26,95,255,.26),inset 0 0 0 1px rgba(255,255,255,.8)}
.vc[data-state=listening] .vc-orb{animation:vcBreath 3.4s ease-in-out infinite}
.vc[data-state=speaking] .vc-orb{animation:vcTalk .95s ease-in-out infinite}
.vc[data-state=speaking] .vc-orb::before{animation-duration:2.4s}
.vc[data-state=connecting] .vc-orb{animation:vcBreath 1.6s ease-in-out infinite;opacity:.85}
.vc[data-state=muted] .vc-orb{filter:grayscale(.85);opacity:.8}
@keyframes vcBreath{50%{transform:scale(1.04)}}
@keyframes vcTalk{0%,100%{transform:scale(1)}30%{transform:scale(1.07)}65%{transform:scale(.98)}}
.vc-cap{width:100%;max-width:440px;min-height:0;margin:0 0 14px;text-align:center;font-size:19px;line-height:1.75;font-weight:500;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.vc .lv{width:100%;max-width:420px;margin:0 0 30px;padding:0;background:none;border:0;box-shadow:none}

.vc .lv-b[data-lv=mic]{display:none}
.vc .lv-b{background:var(--glass);border:0;border-radius:22px;box-shadow:var(--sh2);min-height:58px;backdrop-filter:blur(10px)}
.vc .lv-b.on{background:var(--acs)}.vc .lv-b.bad{background:var(--bads)}
.vc .lv-b.stop.hot{background:var(--bad)}
.vc .lv-opt,.vc .lv-hint{justify-content:center;text-align:center}
.vc-ctl{direction:ltr;position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:46px;margin-top:8px;padding-bottom:10px}
.vc-s{position:relative;z-index:3;width:56px;height:56px;border-radius:50%;background:var(--s1);box-shadow:var(--sh2);display:grid;place-items:center;color:var(--tx)}
.vc-s:active,.vc-mic:active{transform:scale(.94)}
.vc-mic{position:relative;width:86px;height:86px;border-radius:50%;display:grid;place-items:center}
.vc-mic .core{position:relative;z-index:2;width:86px;height:86px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;box-shadow:0 14px 30px color-mix(in srgb,var(--ac) 48%,transparent)}
.vc-mic .core svg.i{width:32px;height:32px}
.vc-mic .ring{position:absolute;inset:-11px;border-radius:50%;background:color-mix(in srgb,var(--ac) 14%,transparent);z-index:1}
.vc-mic .ring.r2{inset:-22px;background:color-mix(in srgb,var(--ac) 8%,transparent)}
.vc[data-state=listening] .vc-mic .ring{animation:ringp 2.2s ease-in-out infinite}

@keyframes ringp{50%{transform:scale(1.12);opacity:.55}}
.vc[data-state=muted] .vc-mic .core{background:var(--bad);box-shadow:0 14px 30px rgba(224,64,90,.4)}
.vc[data-state=muted] .vc-mic .ring{background:rgba(224,64,90,.12)}

#chat{padding-inline:10px}
#gemDrawerMask{direction:ltr}

.gem-drawer-title{padding-bottom:19px}
.gem-mark{font-size:31px;background:linear-gradient(45deg,#4285f4,#9b72cb,#d96570,#f9ab00,#34a853);color:transparent;background-clip:text}
.gem-nav{font-size:14px;padding:13px 14px;border-radius:22px}
.gem-nav.primary{margin-bottom:11px}
.gem-history{max-height:42vh}
.gem-history .gem-nav{font-size:14px;font-weight:400;min-height:48px}
#settings,#memory,#gallery{padding-top:20px}
.sh{border-radius:28px 28px 0 0;box-shadow:0 -12px 45px rgba(0,0,0,.08)}

/* The live voice screen uses the Gemini sparkle and the same soft blue horizon. */
.vc{background:linear-gradient(180deg,#fafafa 0%,#fff 59%,#eff7ff 82%,#a9d6ff 100%);color:#111318}
html.dark .vc{background:linear-gradient(180deg,#15171d 0%,#171a21 60%,#17283a 100%);color:var(--tx)}
.vc-top{direction:ltr;max-width:100%;justify-content:space-between}

.vc[data-state=connecting] .vc-gem-wrap{animation:gemFloat 1.3s ease-in-out infinite}

.vc-cap{font-weight:400;font-size:18px;max-width:500px;color:inherit}
.vc-status{font-size:13px;font-weight:500;color:var(--mu)}
.vc .lv-b{background:rgba(255,255,255,.72);box-shadow:0 2px 14px rgba(35,55,90,.06);border:1px solid rgba(145,160,185,.12);color:#202124}

.vc-s{background:rgba(255,255,255,.86);border:1px solid rgba(140,150,170,.12);box-shadow:0 2px 18px rgba(35,55,90,.08)}
.vc-mic .core{background:linear-gradient(155deg,#e8f2ff 0%,#d0e3ff 45%,#a9cbff 100%);color:#202124;box-shadow:0 8px 24px rgba(66,133,244,.22)}
.vc-mic .core svg.i{stroke-width:1.8}
.vc-mic .ring{background:rgba(142,188,255,.15)}.vc-mic .ring.r2{background:rgba(142,188,255,.09)}
.vc[data-state=muted] .vc-mic .core{background:#f7e5e7;color:#a12835;box-shadow:0 8px 24px rgba(180,45,60,.12)}
.vc .lv{margin-bottom:20px}
#chat .opts:not(:empty) .fld{background:var(--s1);border-radius:15px;min-height:45px}
#chat .opts:not(:empty) label{color:var(--tx);font-size:13px;min-width:100%;}

.gem-account-row{display:flex;align-items:center;gap:8px;padding:7px 5px 4px;direction:rtl}

/* ===== Gemini app clone overrides ===== */
:root{--bg:#f9f9fb;--s2:#f0eff2}
body{background:var(--bg)}
.gem-top,.ch,.in-chat #topChat{background:transparent;backdrop-filter:none;min-height:72px}
.gem-model-button #cTitle,.gem-auto-label{font-size:19px}
.gem-newchat svg{width:26px;height:26px;stroke-width:1.7}
.gem-profile{background:#5b9b3f}
.gemini-home-center{gap:26px;transform:translateY(24px)}
.gemini-home-center h1,body.gemini-empty-chat .gemini-start h3{font-weight:400;letter-spacing:-.02em;direction:ltr;unicode-bidi:isolate}
.gem-mode-pop{left:calc(50px + 6px);top:calc(100% - 8px);width:min(300px,62vw);padding:12px 14px;border:0;border-radius:30px;background:#fff;box-shadow:0 8px 40px rgba(20,25,40,.14)}
.gem-mode-item{min-height:62px;padding:8px 6px;border-radius:14px;gap:12px}
.gem-mode-item.selected{background:transparent}
.gem-mode-item .gem-check{width:26px;font-size:21px}
.gem-mode-item b{font-size:18px;font-weight:400}.gem-mode-item small{font-size:14px;color:#6b6e75}
.gem-mode-divider{margin:4px 8px 6px}
.comp{background:#fff;min-height:68px;box-shadow:0 2px 14px rgba(26,39,64,.07);border-radius:40px}
body.in-chat .dock .comp{background:#fff}
#clipBtn{width:48px;height:48px;border:0}#clipBtn svg.i{width:27px;height:27px;stroke-width:1.6}
#micBtn{color:#1f1f23}
#sendBtn.wave{background:#d9e8fd;color:#1f2430}
#sendBtn.arrow:not(:disabled){background:#d2e3fc;color:#1f2430}
#sendBtn.wave svg.i,#sendBtn.arrow svg.i{transform:none;width:24px;height:24px}
#sendBtn.arrow svg.i{stroke-width:2.3!important;stroke-linecap:round;stroke-linejoin:round}
/* drawer: full-screen like Gemini */
.gem-drawer-mask{background:transparent}
.gem-drawer{width:100%;max-width:none;display:flex;flex-direction:column;background:#f9f9fb;box-shadow:none;animation:in .16s ease-out}
.gem-drawer-title{padding:6px 10px 18px 14px}.gem-drawer-title b{font-size:30px;font-weight:400;letter-spacing:-.02em}
.gem-drawer-title button{width:44px;height:44px;display:grid;place-items:center;color:var(--tx)}
#gemDrawerContent{flex:1;display:flex;flex-direction:column;min-height:0}
.gem-drawer .gem-nav{direction:ltr;text-align:left;font-size:17px;min-height:56px;gap:20px;padding:12px 18px;border-radius:30px}
.gem-nav svg{width:26px;height:26px;stroke-width:1.6}
.gem-nav.primary{background:#f0eff2;margin-bottom:10px;font-weight:400}
.gem-section{direction:ltr;text-align:left;font-size:17px;color:#777a81;font-weight:400;padding:22px 18px 8px}
.gem-history{flex:1;max-height:none;margin-top:4px}
.gem-history .gem-nav{direction:rtl;text-align:right;font-size:17px;padding:12px 18px;min-height:56px}
.gem-account-row{direction:ltr;padding:10px 4px 6px;margin-top:auto}
.gem-account-avatar{width:50px;height:50px;font-size:21px;background:#5b9b3f}
.gem-account-main{font-size:19px}
/* messages */
.msg.user .mb{background:#f0eff2;border-radius:28px 28px 8px 28px}
.msg.ai .ma{gap:14px;margin-top:12px}
.msg.ai .ma button{width:36px;height:36px}
.msg.ai .ma button.on svg.i{fill:currentColor}
/* Live voice screen */
.vc{background:#fafafa;padding-top:calc(12px + var(--safet));justify-content:flex-start}
html.dark .vc{background:#13151a}
.vc-top{direction:ltr;max-width:100%;gap:0}
.vc-top .ib,.vc-pill2{background:#fff;border:1px solid #e9e9ec;box-shadow:none;height:62px;border-radius:99px;color:var(--tx)}
.vc-top .ib{width:62px}
.vc-pill2{display:flex;align-items:center;gap:6px;padding:0 10px}
.vc-pill2 button{width:46px;height:46px;display:grid;place-items:center;border-radius:50%;color:var(--tx)}
.vc-pill2 svg.i,.vc-top .ib svg.i{width:27px;height:27px}
.vc-status{display:none}
.vc-stage{display:block;flex:1;width:100%;max-width:560px;overflow:auto;padding:36px 4px 8px}
.vc-stage::before{display:none}
.vc-u{width:max-content;max-width:78%;margin:0 0 0 auto;padding:22px 30px;border-radius:34px;background:#f1f0f2;font-size:19px;line-height:1.6}
.vc-a{margin:44px 4px 18px;font-size:23px;line-height:2;font-weight:400}
.vc-acts{display:flex;gap:26px;padding:0 4px;color:var(--tx)}.vc-acts button{width:34px;height:34px;display:grid;place-items:center}
.vc-acts svg.i{width:26px;height:26px;stroke-width:1.6}
.vc-cap{width:100%;max-width:560px;margin:0 0 14px;padding:22px 28px;border-radius:30px;background:#f1f0f2;font-size:19px;font-style:italic;text-align:start;display:-webkit-box;-webkit-line-clamp:2;min-height:0}
#vc.nocc .vc-cap,#vc.nocc .vc-stage{visibility:hidden}
.vc .lv{margin:0;max-width:420px}.vc #lvCtl{display:none}
.vc-ctl{direction:ltr;gap:12px;width:100%;max-width:560px;margin:0;padding-bottom:8px;justify-content:space-between}
.vc-s{width:66px;height:66px;background:#fff;border:0;box-shadow:none;color:var(--tx);flex:none}
.vc-s svg.i{width:28px;height:28px;stroke-width:1.7}
.vc-s.on{background:#d9e8fd}
.vc-wave{flex:1;height:90px;border-radius:50px;background:linear-gradient(180deg,#fff 0%,#eaf2ff 45%,#a9c6f5 100%);box-shadow:none;overflow:hidden;position:relative}
.vc[data-state=speaking] .vc-wave{animation:vcBreath 1s ease-in-out infinite}
.vc[data-state=listening] .vc-wave{animation:vcBreath 2.6s ease-in-out infinite}
.vc[data-state=muted] .vc-wave{filter:grayscale(1);opacity:.6}
.vc-voice{display:none;position:absolute;inset:0;z-index:5;background:#fafafa;flex-direction:column;padding:calc(14px + var(--safet)) 18px calc(18px + var(--safeb));direction:ltr}
html.dark .vc-voice{background:#13151a}
.vc-voice.on{display:flex}
.vc-vh{font-size:21px;text-align:center;padding:22px 0 14px}
#vcVList{flex:1;overflow:auto;padding-bottom:90px}
.vc-vi{display:flex;align-items:center;width:100%;text-align:left;padding:26px 28px;font-size:34px;color:#777a81;border-radius:60px;font-weight:400}
.vc-vi.on{background:#dcecfd;color:var(--tx);justify-content:space-between}
.vc-vi.on::after{content:"✓";font-size:34px}
.vc-vf{position:absolute;inset-inline:0;bottom:calc(14px + var(--safeb));display:flex;justify-content:center;gap:18px;align-items:center}
.vc-vf button{padding:20px 38px;border-radius:50px;font-size:19px}.vc-vf .ok{background:#dcdce0;color:#8b8e94}.vc-vf .ok.act{background:#0b57d0;color:#fff}

/* ===== Settings / pages: Gemini look ===== */
#settings,#memory,#gallery,#chats,#tools{max-width:680px;margin:auto;padding:8px 16px 140px}
h1.pt{font-size:32px;font-weight:400;letter-spacing:-.02em;margin:14px 4px 4px}
.sub{font-size:13.5px;color:#6b6e75;margin:0 4px 16px;line-height:1.8}
.sec b,.manage-section-head b{font-weight:500}
.gem-card,.manage-section{background:#fff;border:0;border-radius:28px;padding:18px;margin:0 0 14px;box-shadow:none}
html.dark .gem-card,html.dark .manage-section{background:#1b1e24}
.gem-card>b{font-size:17px;font-weight:500;display:block;margin:0 2px 2px}

/* ===== FIX 1: side drawer scroll (panel scrolls, page behind stays still) ===== */
body.gem-lock{position:fixed;left:0;right:0;width:100%;overflow:hidden}
.gem-drawer-mask{overscroll-behavior:contain;height:100vh;height:100dvh}
.gem-drawer{height:100%;overflow:hidden;overscroll-behavior:contain;box-sizing:border-box}
html.dark .gem-drawer{background:var(--bg)}
#gemDrawerContent{flex:1;min-height:0;display:block;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding-bottom:6px}
.gem-history{flex:none;max-height:none;overflow:visible}
.gem-account-row{position:sticky;bottom:0;margin-top:12px;padding-bottom:calc(8px + var(--safeb));background:linear-gradient(180deg,transparent,#f9f9fb 22%);z-index:2}
html.dark .gem-account-row{background:linear-gradient(180deg,transparent,var(--bg) 22%)}

/* ===== FIX 2: live voice screen, Gemini-app proportions (48dp controls, wide centre pill) ===== */
.vc{padding-inline:18px;padding-bottom:calc(14px + var(--safeb));height:100vh;height:100dvh;box-sizing:border-box}
.vc-top{min-height:48px}
.vc-top .ib,.vc-pill2{height:48px;box-sizing:border-box}
.vc-top .ib{width:48px;flex:none}
.vc-pill2{padding:0 6px;gap:2px}
.vc-pill2 button{width:40px;height:40px}

/* ===== UNIFIED DESIGN SCALE (final layer: one size system for every screen) =====
   type: 12 / 13.5 / 15 / 16 / 18 / 20 / 28   controls: 44 (icon buttons), 48 (fields), 60 (composer)
   radius: 16 / 24 / pill                                                                      */
:root{--fs-xs:12px;--fs-sm:13.5px;--fs-md:15px;--fs-lg:16px;--fs-xl:18px;--ctl:44px;--ctl-in:48px;--r-card:24px;--hit:44px}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-size:var(--fs-md);line-height:1.7;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
svg.i{stroke-width:1.8}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}

/* top bar: same 44px buttons, same 18px title everywhere */
.gem-top,.ch,.in-chat #topChat{min-height:64px;padding:calc(10px + var(--safet)) 12px 10px;gap:8px}
.gem-menu-button,.gem-newchat,.gem-profile{width:var(--ctl);height:var(--ctl)}
.gem-menu-button svg.i{width:24px;height:24px}
.gem-newchat svg{width:24px;height:24px;stroke-width:1.7}
.gem-profile{font-size:var(--fs-lg)}
.gem-model-button,.gem-model-button #cTitle,.gem-auto-label{font-size:var(--fs-xl);font-weight:450}
.gem-chevron{width:18px;height:18px}
@media(max-width:480px){
 .gem-menu-button,.gem-newchat,.gem-profile{width:var(--ctl);height:var(--ctl)}
 .gem-model-button,.gem-model-button #cTitle,.gem-auto-label{font-size:var(--fs-xl)}
}

/* mode popover */
.gem-mode-pop{width:min(280px,calc(100vw - 80px));padding:8px 10px;border-radius:var(--r-card)}
.gem-mode-item{min-height:56px;padding:8px 6px;gap:10px}
.gem-mode-item b{font-size:var(--fs-lg);font-weight:500}
.gem-mode-item small{font-size:var(--fs-xs)}
.gem-mode-item .gem-check{width:22px;font-size:18px}

/* home / empty chat headline */
.gemini-home-center h1,body.gemini-empty-chat .gemini-start h3{font-size:clamp(26px,7vw,34px);line-height:1.3}

/* composer: one height, one button size, one icon size */
.comp{min-height:60px;padding:6px 8px;gap:4px;border-radius:32px}
.comp textarea{font-size:var(--fs-lg);min-height:44px;padding:10px 8px;line-height:1.5}
.rb,#clipBtn,#micBtn,#sendBtn{width:var(--ctl);height:var(--ctl)}
#clipBtn svg.i,#micBtn svg.i,#sendBtn svg.i,#sendBtn.wave svg.i,#sendBtn.arrow svg.i{width:24px;height:24px;stroke-width:1.7}
@media(max-width:480px){.comp{min-height:60px;padding:6px 8px}.comp textarea{font-size:var(--fs-lg);min-height:44px}#clipBtn,#sendBtn,#micBtn{width:var(--ctl);height:var(--ctl)}}
body.gemini-home-screen .dock,body.gemini-empty-chat .dock,body.in-chat .dock{padding:12px 14px calc(12px + var(--safeb))}

/* messages */
.msg.user .mb{font-size:var(--fs-lg);line-height:1.7;padding:12px 18px;border-radius:24px 24px 8px 24px}
.msg.ai .mb{font-size:var(--fs-lg);line-height:1.85}
.msg.ai>.gemini-mark{width:26px;height:26px}
.msg.ai .ma{gap:2px;margin-top:10px}
.msg.ai .ma button,.ma button{width:40px;height:40px;padding:0;justify-content:center}
.ma .i,.msg.ai .ma button .i{width:20px;height:20px}
.mt,.mh,.st{font-size:var(--fs-xs)}
.md h4{font-size:18px;font-weight:600;margin:16px 0 6px}
.md code{font-size:.9em}
.code-h{font-size:var(--fs-xs);padding:8px 14px}.code-h button{font-size:var(--fs-xs)}
.code code{font-size:13px;line-height:1.7}
.md table{font-size:var(--fs-sm)}
.sys{font-size:var(--fs-sm)}

/* pages (settings / memory / library / chats) */
h1.pt{font-size:28px;line-height:1.3}
.sub{font-size:var(--fs-sm)}
.gem-card,.manage-section{padding:16px;border-radius:var(--r-card)}
.gem-card>b{font-size:var(--fs-lg)}
.manage-section-head b{font-size:var(--fs-lg)}.manage-section-head small{font-size:var(--fs-xs)}
.row{min-height:56px;padding:12px 14px;border-radius:20px}
.rc b{font-size:var(--fs-lg)}.rc small{font-size:var(--fs-xs)}
.chip,.gem-library-icon{width:var(--ctl);height:var(--ctl)}

.manage-item-text{font-size:var(--fs-md)}

.manage-actions button{font-size:var(--fs-sm);min-height:40px}
.fld,#chatSearch{min-height:var(--ctl-in);font-size:var(--fs-md);padding:12px 18px;border-radius:24px}
.pill{font-size:var(--fs-sm);padding:9px 16px;min-height:40px}
.btn{font-size:var(--fs-md);padding:14px;min-height:var(--ctl-in)}
.tool-choice{min-height:64px;padding:12px 14px}
.tool-choice b{font-size:var(--fs-md)}.tool-choice small{font-size:var(--fs-xs)}

/* side drawer */
.gem-drawer-title b{font-size:26px}
.gem-drawer-title button{width:var(--ctl);height:var(--ctl)}
.gem-drawer .gem-nav,.gem-history .gem-nav{font-size:var(--fs-lg);min-height:52px;padding:10px 16px;gap:16px;border-radius:26px}
.gem-nav svg{width:24px;height:24px}
.gem-section{font-size:var(--fs-sm);padding:18px 16px 6px}
.gem-account-avatar{width:44px;height:44px;font-size:var(--fs-lg)}
.gem-account-main{font-size:var(--fs-lg)}
.gem-set-ic svg{width:22px;height:22px}

/* live voice: align with the same scale */
.vc-cap,.vc-u{font-size:var(--fs-lg)}
.vc-a{font-size:var(--fs-xl)}
.lv-b small{font-size:11.5px}

/* dark mode: remove hard-coded white surfaces */
html.dark .comp,html.dark body.in-chat .dock .comp,html.dark .gem-mode-pop,html.dark .tile,html.dark .tool-icon,html.dark .gem-card,html.dark .manage-section{background:var(--s1)}
html.dark .comp textarea::placeholder{color:var(--mu)}
html.dark #micBtn,html.dark #clipBtn{color:var(--tx)}
html.dark .gem-mode-item small{color:var(--mu)}
html.dark #sendBtn{background:var(--s2);color:var(--mu)}
html.dark #sendBtn:not(:disabled),html.dark body.in-chat .dock .rb.send:not(:disabled){background:#2f4a73;color:#e8f0ff}
html.dark .vc-top .ib,html.dark .vc-pill2,html.dark .vc-s,html.dark .vc-cap,html.dark .vc-u{background:var(--s1);border-color:var(--ln);color:var(--tx)}
html.dark .vc-s.on{background:#2f4a73}
html.dark .vc-vi.on{background:#2f4a73}
html.dark .row.sel,html.dark .gem-card .list .row.sel,html.dark .list>.row.sel,html.dark .pill.on,html.dark .tool-choice.selected,html.dark .tool-state{background:#2f4a73;color:#e8f0ff}
html.dark .sub{color:var(--mu)}

/* drawer: Settings stays pinned to the bottom even when the chat list is short */
#gemDrawerContent{display:flex;flex-direction:column}
#gemDrawerContent>*{flex:none}
#gemDrawerContent>.gem-history{flex:1 0 auto}
#gemDrawerContent>.gem-account-row{margin-top:auto}

.gem-drawer{padding-bottom:0}
#gemDrawerContent{padding-bottom:0}
#gemDrawerContent>.gem-account-row{padding:20px 4px calc(10px + var(--safeb));background:linear-gradient(180deg,rgba(249,249,251,0),#f9f9fb 20px)}
html.dark #gemDrawerContent>.gem-account-row{background:linear-gradient(180deg,rgba(19,21,26,0),var(--bg) 20px)}

/* header: solid surface so messages never run underneath it */
.gem-top,.ch,.in-chat #topChat{background:var(--bg)!important;backdrop-filter:none}
.gem-top::after,.ch::after{content:"";position:absolute;left:0;right:0;top:100%;height:16px;background:linear-gradient(var(--bg),color-mix(in srgb,var(--bg) 0%,transparent));pointer-events:none}
/* live connection banner above the composer is not shown */
.voice-live-status,.voice-live-status.on{display:none!important}

/* AI answers: plain text on the page, no card/box; user bubble without glow */
.msg.ai .mb{background:none!important;box-shadow:none!important;border:0!important;border-radius:0!important;max-width:100%;padding:0 1px}
.msg.user .mb{box-shadow:none!important}
</style>

<script>
/* Visible runtime diagnostics: avoid a silent blank screen if UI code fails. */
(function installMiniAppErrorBoundary(){
  function showMiniAppError(reason){
    try {
      const message = String(reason && (reason.message || reason.reason || reason) || 'خطای نامشخص').slice(0, 180);
      const home = document.getElementById('home');
      if (!home) return;
      document.querySelectorAll('.screen').forEach(function (screen) { screen.classList.remove('on'); });
      document.body.classList.remove('in-chat');
      home.classList.add('on');
      home.innerHTML = '<div style="margin:20px 0;padding:18px;border-radius:20px;background:var(--s1);border:1px solid var(--ln);direction:rtl;text-align:right">'
        + '<h2 style="margin:0 0 8px;font-size:18px">بارگذاری مینی‌اپ کامل نشد</h2>'
        + '<p style="margin:0 0 10px;color:var(--mu);font-size:13px">یک خطای رابط کاربری رخ داد. دکمهٔ تلاش دوباره را بزن؛ اگر تکرار شد، متن خطا را برای پشتیبانی بفرست.</p>'
        + '<code style="display:block;white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;margin:8px 0 12px">' + message.replace(/[&<>"']/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]}) + '</code>'
        + '<button onclick="location.reload()" style="padding:10px 14px;border-radius:12px;background:var(--ac);color:white;font-weight:700">تلاش دوباره</button></div>';
    } catch (_) {}
  }
  window.addEventListener('error', function (event) { showMiniAppError(event.message || event.error); });
  window.addEventListener('unhandledrejection', function (event) { showMiniAppError(event.reason); });
})();

function xhrUploadChunk(url,blob,item,offset,total){return new Promise((resolve,reject)=>{const xhr=new XMLHttpRequest();item.xhr=xhr;xhr.open('POST',API_BASE+url,true);xhr.timeout=90000;xhr.setRequestHeader('X-Mini-App-Client-ID',clientId);const override=LS.get('baleMiniAppWorkspaceOverride');if(override)xhr.setRequestHeader('X-Mini-App-Workspace-ID',override);const init=baleInitData();if(init)xhr.setRequestHeader('X-Bale-Init-Data',init);xhr.setRequestHeader('Content-Type','application/octet-stream');xhr.upload.onprogress=e=>{if(e.lengthComputable){item.progress=Math.min(99,Math.floor((offset+e.loaded)/Math.max(total,1)*100));if(cur()&&state.cid===item.sessionId)renderDraft()}};xhr.onload=()=>{item.xhr=null;let d={};try{d=JSON.parse(xhr.responseText||'{}')}catch{}if(xhr.status>=200&&xhr.status<300&&d.ok!==false)resolve(d);else reject(new Error(d.error||`خطای بارگذاری (${xhr.status})`))};xhr.onerror=()=>{item.xhr=null;reject(new Error('ارتباط هنگام بارگذاری قطع شد'))};xhr.ontimeout=()=>{item.xhr=null;reject(new Error('بارگذاری بیش از ۹۰ ثانیه پاسخ نداد؛ دوباره تلاش کن'))};xhr.onabort=()=>{item.xhr=null;reject(new Error('بارگذاری لغو شد'))};xhr.send(blob)})}
async function uploadPendingFile(sid,item){if(!item||item.status==='uploaded')return;if(item.xhr){try{item.xhr.abort()}catch{}}item.status='uploading';item.error='';item.progress=0;item.sessionId=sid;renderDraft();try{if(item.uploadId){try{await api(`/api/uploads/${encodeURIComponent(item.uploadId)}/cancel`,{method:'POST',body:JSON.stringify({})})}catch{}}const start=await api('/api/uploads/start',{method:'POST',body:JSON.stringify({name:item.name,type:item.type,size:item.size,lastModified:item.lastModified})});item.uploadId=start.upload_id;const size=Math.max(256*1024,Math.min(Number(start.chunk_size)||2*1024*1024,2*1024*1024));for(let offset=0;offset<item.size;offset+=size){if(item.removed)throw new Error('بارگذاری لغو شد');const end=Math.min(offset+size,item.size);await xhrUploadChunk(`/api/uploads/${encodeURIComponent(item.uploadId)}/chunk?offset=${offset}`,item.file.slice(offset,end),item,offset,item.size);item.progress=Math.min(99,Math.floor(end/Math.max(item.size,1)*100));renderDraft()}const done=await api(`/api/uploads/${encodeURIComponent(item.uploadId)}/complete`,{method:'POST',body:JSON.stringify({})});item.uploadedAttachment=done.attachment;item.status='uploaded';item.progress=100;item.file=null;renderDraft();toast(`فایل «${item.name}» آمادهٔ ارسال است`)}catch(e){if(item.removed)return;item.status='error';item.error=String(e.message||e);renderDraft();toast(`بارگذاری ناموفق: ${item.error}`)}finally{item.xhr=null;refreshSendState()}}
async function removePendingFile(index){const s=cur();if(!s)return;const a=pend[s.id]||[],x=a[Number(index)];if(!x)return;x.removed=true;if(x.xhr){try{x.xhr.abort()}catch{}}if(x.uploadId)api(`/api/uploads/${encodeURIComponent(x.uploadId)}/cancel`,{method:'POST',body:JSON.stringify({})}).catch(()=>{});a.splice(Number(index),1);pend[s.id]=a;renderDraft()}

async function refreshStats(){
  if(state.statsLoading)return;
  state.statsLoading=true;state.statsError='';if(state.page==='settings')renderSettings();
  try{const r=await api('/api/stats?refresh='+Date.now());state.stats=r.stats||null;if(!state.stats)throw new Error('سرور آمار قابل‌خواندن برنگرداند');}
  catch(e){state.statsError=String(e.message||e);if(!state.stats)toast('دریافت آمار ناموفق بود: '+state.statsError)}
  finally{state.statsLoading=false;if(state.page==='settings')renderSettings()}
}

}

async function poll(jobId,sid,mid){const t0=Date.now();let fails=0;
  while(Date.now()-t0<30*60*1000){
    let r;try{r=await api('/api/jobs/'+encodeURIComponent(jobId));fails=0}catch(e){if(++fails>=5)throw new Error('ارتباط با پردازش قطع شد؛ چت را دوباره باز کن.');await sleep(1500);continue}
    const job=r.job||{},s=state.sessions[sid];if(!s)return;
    const m=(s.messages||[]).find(x=>x.id===mid);
    if(job.status==='done'&&job.chat){state.sessions[sid]=norm(job.chat);paint(true);return}
    if(job.status==='cancelled'){if(job.chat){state.sessions[sid]=norm(job.chat);paint(true)}else if(m){m.meta={model:m.meta.model,statusText:'متوقف شد'};paint(true)}toast('پاسخ متوقف شد');return}
    if(job.status==='error'){if(job.chat){state.sessions[sid]=norm(job.chat);paint(true)}throw new Error(job.error||(job.status==='cancelled'?'پردازش متوقف شد':'پردازش ناموفق بود'))}
    if(m){const nt=job.partial_text??m.text,ns=job.message||'';if(nt!==m.text||ns!==m.meta.statusText){m.text=nt;m.meta.statusText=ns;paint()}}
    await sleep(600);
  }
  throw new Error('این پردازش بیش از حد طول کشید؛ چت را دوباره باز کن.');
}

  if(idle){b.innerHTML=ic('wave');b.dataset.icon='wave';b.dataset.act='voicechat';b.setAttribute('aria-label','Live');b.title='گفت‌وگوی صوتی'}
  else{if(b.dataset.icon==='wave'){b.dataset.icon='';if(!state.sending&&!b.classList.contains('uploading'))b.innerHTML=ic('send')}b.dataset.act='send';b.setAttribute('aria-label','Send')}}
$('#inp').addEventListener('input',gemSendBtn);
/* message actions: like, dislike, share, copy, more */
function gemActs(m,ai,meta){if(meta.pending)return '';const id=esc(m.id),fv=FBS[m.id]||'';
  const b=(a,i,t,c='')=>`<button class="${c}" data-act="${a}" data-id="${id}" title="${t}" aria-label="${t}">${ic(i)}</button>`;
  return `<div class="ma">${ai?b('like','like','Good response',fv==='up'?'on':'')+b('dislike','dislike','Bad response',fv==='down'?'on':'')+b('share','share','Share')+b('copy','copy','Copy')+b('more','more','More'):b('copy','copy','Copy')}</div>`}
/* Live: voice names, transcript, controls */
const VOICE_MAP=[['Pegasus','Charon'],['Orbit','Puck'],['Flare','Fenrir'],['Glow','Kore'],['Ursa','Orus'],['Orion','Zephyr'],['Eclipse','Enceladus'],['Dipper','Aoede'],['Vega','Leda'],['Capella','Algenib'],['Lyra','Sadaltager'],['Sirius','Iapetus']];
let vvSel='',vcLast={u:'',a:''};
function vvRender(){const cur0=state.voice;$('#vcVList').innerHTML=VOICE_MAP.map(([n,v])=>`<button class="vc-vi ${v===vvSel?'on':''}" data-act="vvpick" data-id="${v}">${n}</button>`).join('');$('#vvOk').classList.toggle('act',vvSel!==cur0);}
function vcShare(t){if(navigator.share)navigator.share({text:t}).catch(()=>{});else copyText(t)}
$('#vcBack').innerHTML=ic('menu');$('#vcCC').innerHTML=ic('cc');$('#vcMore').innerHTML=ic('more');$('#vcCam').innerHTML=ic('vcam');$('#vcUp').innerHTML=ic('upl');
setInterval(()=>{if(!state.voiceConversation){vcLast={u:'',a:''};const t=$('#vcTx');if(t&&t._h){t.innerHTML='';t._h=''}return}
  const u=liveTurnUserText.trim(),a=liveTurnAssistantText.trim();if(u&&u!==vcLast.u){vcLast.u=u;if(!a)vcLast.a=''}if(a)vcLast.a=a;
  const h=(vcLast.u?`<div class="vc-u" dir="auto">${esc(vcLast.u)}</div>`:'')+(vcLast.a?`<div class="vc-a" dir="auto">${esc(vcLast.a)}</div><div class="vc-acts"><button data-act="vclike" aria-label="Like">${ic('like')}</button><button data-act="vcdislike" aria-label="Dislike">${ic('dislike')}</button><button data-act="vcshare" aria-label="Share">${ic('share')}</button><button data-act="vccopy" aria-label="Copy">${ic('copy')}</button><button data-act="vcmore2" aria-label="More">${ic('more')}</button></div>`:'');
  const t=$('#vcTx');if(t._h!==h){t.innerHTML=h;t._h=h;t.scrollTop=t.scrollHeight}
  $('#vcCam').classList.toggle('on',LV.cam.on);$('#vcUp').classList.toggle('on',LV.scr.on)},300);
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id,s=cur();
  const msg=()=>s&&(s.messages||[]).find(x=>String(x.id)===String(id));
  if(a==='share'){const m=msg();if(m)vcShare(m.text)}
  else if(a==='more'){const m=msg();if(!m)return;sheet(`<div class="list"><button class="row" data-act="speak" data-id="${esc(id)}"><span class="chip" style="--h:205">${ic('speaker')}</span><span class="rc"><b>Read aloud</b></span></button><button class="row" data-act="retry" data-id="${esc(id)}"><span class="chip" style="--h:250">${ic('redo')}</span><span class="rc"><b>Regenerate</b></span></button></div>`)}
  else if(a==='vccam')lvAct('cam');
  else if(a==='vcup')lvAct(LV.scrSupported?'scr':'shot');
  else if(a==='vcstop')liveStopResponse();
  else if(a==='vccc')$('#vc').classList.toggle('nocc');
  else if(a==='vcvoice'){vvSel=state.voice;vvRender();$('#vcVoice').classList.add('on')}
  else if(a==='vvpick'){vvSel=id;vvRender()}
  else if(a==='vvcancel')$('#vcVoice').classList.remove('on');
  else if(a==='vvok'){if(vvSel===state.voice){$('#vcVoice').classList.remove('on');return}state.voice=vvSel;if(s)s.voice=vvSel;syncSettings({voice:vvSel});$('#vcVoice').classList.remove('on');if(state.voiceConversation){stopVoiceConversation(false);toggleVoiceConversation()}}
  else if(a==='vccopy')copyText(vcLast.a);
  else if(a==='vcshare')vcShare(vcLast.a);
  else if(a==='vclike'||a==='vcdislike')b.classList.toggle('on');
});
gemSyncModeMenu();gemSendBtn();
/* model selection style: new (Auto + levels) / old (manual model list) */
const GEM_STYLE=()=>LS.get('gemModelStyle')==='old'?'old':'new';
function gemModelSheet(){const s=cur()||list()[0]||null;const curId=mId((s&&s.model)||mId(state.model));sheet('<h3>Model</h3><div class="list">'+GROUPS.map(g=>g[1].map(m=>`<button class="row ${mId(m)===curId?'sel':''}" data-act="model" data-id="${m}"><span class="chip" style="--h:250">${ic('spark')}</span><span class="rc"><b>${m}</b><small>${g[0]}</small></span>${mId(m)===curId?'<span class="tool-state on">✓</span>':''}</button>`).join('')).join('')+'</div>')}
function gemApplyStyle(){const b=document.querySelector('.gem-model-button');if(b)b.dataset.act=GEM_STYLE()==='old'?'gem-models':'gem-mode'}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act="gem-models"]');if(!b)return;try{gemModelSheet()}catch(err){toast(String(err.message||err))}});
document.addEventListener('click',e=>{if(GEM_STYLE()!=='old')return;const b=e.target.closest('[data-act="gem-mode"]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();gemModelSheet()},true);
const _tgm=toggleGemModeMenu;
toggleGemModeMenu=function(f){if(GEM_STYLE()==='old'){_tgm(false);if(f!==false&&cur())gemModelSheet();return}_tgm(f)};
function gemStyleLabel(){gemApplyStyle();const l=document.querySelector('.gem-auto-label'),s=cur();if(l)l.textContent=(state.auto&&GEM_STYLE()!=='old')?'Auto':mLabel((s&&s.model)||mId(state.model))}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act="mstyle"]');if(!b)return;const st=b.dataset.id;LS.set('gemModelStyle',st);
  if(st==='old'&&state.auto)await toggleAuto();else if(st==='new'&&!state.auto)await toggleAuto();
  gemStyleLabel();if(state.page==='settings')renderSettings();toast(st==='old'?'سبک قدیمی: انتخاب دستی مدل':'سبک جدید فعال شد')});
if(GEM_STYLE()==='old')state.auto=false;gemApplyStyle();


applyTheme();go('home');boot();
addEventListener('load',()=>{try{const W=window.Bale?.WebApp||window.Telegram?.WebApp;W?.ready?.();W?.expand?.()}catch{}});

</script>
