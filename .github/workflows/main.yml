name: Build Android Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Web Directory
        run: |
          set -e

          test -f index.html

          mkdir -p www
          cp index.html www/index.html

          echo "Web directory prepared successfully."

      - name: Initialize Node.js Project
        run: |
          set -e

          if [ ! -f package.json ]; then
            npm init -y
          fi

      - name: Install Capacitor Dependencies
        run: |
          set -e

          npm install \
            @capacitor/core@7 \
            @capacitor/cli@7 \
            @capacitor/android@7

      - name: Initialize Capacitor
        run: |
          set -e

          npx cap init "My Web App" "com.example.mywebapp" --web-dir www

      - name: Add Android Platform
        run: |
          set -e

          npx cap add android

      - name: Copy Web Assets to Android
        run: |
          set -e

          npx cap copy android

      - name: Build Android Debug APK
        working-directory: android
        run: |
          set -e

          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          set -e

          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK file not found!"
            exit 1
          fi

          echo "APK generated successfully."
          ls -lh "$APK_PATH"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
