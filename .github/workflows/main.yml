name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04

    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_PATH="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          if [ ! -d "$SDK_PATH" ]; then
            echo "Android SDK directory not found!"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_PATH" >> "$GITHUB_ENV"

          echo "Android SDK found at:"
          echo "$SDK_PATH"

          echo "Installed Android platforms:"
          ls -la "$SDK_PATH/platforms" || true

      - name: Prepare Web Directory
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f index.html ]; then
            echo "ERROR: index.html not found!"
            exit 1
          fi

          mkdir -p www

          cp index.html www/index.html

          echo "Web directory created successfully."

          ls -la www

      - name: Initialize Node.js Project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f package.json ]; then
            npm init -y
          fi

          echo "Node.js project ready."

      - name: Install Capacitor
        shell: bash
        run: |
          set -euo pipefail

          npm install --save-exact \
            @capacitor/core@7 \
            @capacitor/cli@7 \
            @capacitor/android@7

          echo "Capacitor installed successfully."

          npx cap --version

      - name: Initialize Capacitor
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f capacitor.config.json ] && \
             [ ! -f capacitor.config.ts ] && \
             [ ! -f capacitor.config.js ]; then

            npx cap init \
              "My Web App" \
              "com.example.mywebapp" \
              --web-dir www

          fi

          echo "Capacitor initialized."

      - name: Add Android Platform
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d android ]; then
            npx cap add android
          fi

          echo "Android platform ready."

      - name: Copy Web Files
        shell: bash
        run: |
          set -euo pipefail

          npx cap copy android

          echo "Web files copied to Android."

      - name: Grant Gradle Permission
        shell: bash
        run: |
          set -euo pipefail

          chmod +x android/gradlew

      - name: Build Debug APK
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated!"
            exit 1
          fi

          echo "================================="
          echo "APK BUILD SUCCESSFUL"
          echo "================================="

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Android-App-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build Completed
        if: success()
        run: |
          echo "Android APK generated successfully!"
          echo "Download it from the Actions Artifacts section."
